name: ci

on:
  # Paused until CI is turned back on: it runs only when started by hand, and every check below runs
  # before each push instead, through the pre-push hook (tools/ci/local.ts, list in tools/ci/local-checks.ts).
  # To turn it back on, put back these triggers in place of workflow_dispatch:
  #   push:
  #     branches: [main]
  #   pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: scrub and DCO gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/scrub/cli.ts --tree
      - run: node tools/scrub/cli.ts --github
      - run: node tools/dco/cli.ts --github
      # Fails on a skipped, focused or todo plugin test (see CONTRIBUTING.md).
      - run: node tools/ci/plugin-tests-cli.ts
      # Fails when a README picture is stale: run `npm run docs:images` and commit the result.
      - run: node tools/docs/images-cli.ts --check

  size-rule:
    name: commit size rule
    # Fails a commit over 400 changed non-test lines or 15 non-test files whose message has no
    # Large-commit: <reason> line, teamrig's push guard rule (see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/size-rule-cli.ts --github

  coverage:
    name: coverage gate
    # Fails on a failing, skipped or todo test, a source file no test loads, or a file or total
    # below the floors in tools/ci/coverage.json (see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node tools/ci/coverage-cli.ts

  plugin-version:
    name: plugin version gate
    # Fails a change under the plugin's folder that does not raise the version in its plugin.json
    # above the base's (installs update only when it rises), and a version in a marketplace entry,
    # which Claude Code ignores (see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/plugin-version-cli.ts --github

  core-sync:
    name: hooks/core matches the teamrig pin
    # Fails when plugins/teamrig-pane/hooks/core differs from teamrig's read modules at the commit
    # scripts/teamrig-pin.json names, or when a format number there trails teamrig main's (see
    # CONTRIBUTING.md). teamrig is private, so this is the only job that holds TEAMRIG_READ_TOKEN; it
    # installs nothing and runs only the repo's own sync script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository_owner }}/teamrig
          token: ${{ secrets.TEAMRIG_READ_TOKEN }} # fine-grained, contents:read on teamrig only; drop once teamrig is public
          path: teamrig-src
          fetch-depth: 0 # the pin may not be the tip; also brings origin/main, which --formats reads
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node --disable-warning=ExperimentalWarning scripts/sync-core.ts --teamrig ../../teamrig-src --check
        working-directory: plugins/teamrig-pane
      - run: node --disable-warning=ExperimentalWarning scripts/sync-core.ts --teamrig ../../teamrig-src --formats
        working-directory: plugins/teamrig-pane

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # Each run tests all three OSes on node 22 and 24, since paths,
    # renames and process launch differ by OS (macOS minutes bill at 10x, Windows at 2x).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The plugin's tests run inside Claude Code's own runtime, not the job's node, so once per OS.
      # The release is pinned to the oldest one the tests pass on (earlier test kits cannot draw a
      # pane); its install script runs on its own, after an install with scripts off, to link the
      # platform binary.
      - name: install Claude Code
        if: matrix.node == 24
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.295 --ignore-scripts --no-audit --no-fund
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      # An empty home and config folder: no account, settings or other plugins reach the tests.
      - name: plugin tests
        if: matrix.node == 24
        shell: bash
        env:
          HOME: ${{ runner.temp }}/claude-home
          USERPROFILE: ${{ runner.temp }}/claude-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home/.claude
        run: |
          node -e "require('node:fs').mkdirSync(process.env.CLAUDE_CONFIG_DIR, { recursive: true })"
          claude plugin test plugins/teamrig-pane
