name: release

on:
  # Each merge to main updates the release pull request; merging that one tags main and publishes the release.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never one cancelled half-way between its tag and its notes.
concurrency:
  group: release
  cancel-in-progress: false

# Each job stops after 20 minutes (timeout-minutes), as in ci.yml.
jobs:
  release-please:
    name: release pull request
    # release-please keeps one pull request open that raises the version in plugin.json
    # (release-please-config.json) and writes the notes from the commits since the last release; a person reviews
    # and merges it, as any pull request. Once it merged, the next run tags main's commit teamrig-pane-v<version>
    # and publishes the notes as a GitHub release.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # What the run released, for the job that adds the dedicated UI to it (below): empty on a run that released
    # nothing.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # A job's permissions replace the workflow's: contents to tag and commit the raise, pull-requests to open the
    # release pull request, actions to run ci.yml on it (below).
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request the workflow's own token opens or updates starts no workflow, so the required check would
      # never report on it. A run by hand is the one event that token may start: ci.yml runs on the release branch's
      # head, where the pull request reads its checks. The pull request goes in as a plain value and the script reads
      # its branch: GitHub reads a step's env even when its `if` skips it, and fromJSON of a run's empty pr output
      # fails the whole job.
      - name: run ci on the release pull request
        if: ${{ steps.release.outputs.pr != '' }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(node -p 'JSON.parse(process.env.PR).headBranchName')"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}

  ui-archive-build:
    name: dedicated UI archive, built
    # A published release carries the dedicated UI as one file, teamrig-ui.json, which `teamrig ui` fetches and
    # holds to a sha256 pinned in teamrig (CONTRIBUTING.md). It is built from the released tag's tree, with the
    # workflow's read-only token: the build runs package code, so it never shares a job with the token that writes.
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run ui:archive
      # The log prints the sha256 to pin; the upload job holds the file it gets to the same value.
      - id: hash
        run: echo "sha256=$(sha256sum .tmp/ui-archive/teamrig-ui.json | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamrig-ui
          path: .tmp/ui-archive/teamrig-ui.json
          if-no-files-found: error
          retention-days: 1

  ui-archive-upload:
    name: dedicated UI archive, added to the release
    # The one job that holds a token able to write: it checks out nothing and runs no package code, only the hash
    # check and the upload.
    needs: [release-please, ui-archive-build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teamrig-ui
      - name: hold the archive to the build's sha256
        run: echo "$SHA256  teamrig-ui.json" | sha256sum -c -
        env:
          SHA256: ${{ needs.ui-archive-build.outputs.sha256 }}
      # No --clobber: a release's archive is pinned by its sha256, so a second run fails here and never replaces it.
      # The tag goes in as a plain value, never as text of the script.
      - name: add the archive to the release
        run: gh release upload "$TAG" teamrig-ui.json --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
